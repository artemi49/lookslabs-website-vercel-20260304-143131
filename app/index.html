<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LooksLab — App Store</title>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var partner = params.get("ref") || "Webseite_Direkt";
            var appId = "6760189133";
            var ptId = "128604503";
            var qs = "pt=" + ptId + "&ct=" + encodeURIComponent(partner) + "&mt=8";
            var url = "https://apps.apple.com/app/apple-store/id" + appId + "?" + qs;
            window.location.replace(url);
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
        }
        p { margin: 0; font-size: 0.95rem; color: rgba(255, 255, 255, 0.78); }
        a { color: #fff; }
    </style>
</head>
<body>
    <p>Opening the App Store&hellip;</p>
    <noscript>
        <p><a href="https://apps.apple.com/app/apple-store/id6760189133?pt=128604503&amp;ct=Webseite_Direkt&amp;mt=8">Continue to the App Store</a></p>
    </noscript>
</body>
</html>
