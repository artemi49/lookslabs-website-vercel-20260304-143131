<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening LooksLab…</title>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const partner = urlParams.get('ref') || 'Webseite_Direkt';

            const appId = "6760189133";
            const ptId = "128604503";

            const ct = encodeURIComponent(partner);
            const finalLink = "https://apps.apple.com/app/apple-store/id" + appId + "?pt=" + ptId + "&ct=" + ct + "&mt=8";

            window.location.href = finalLink;
        };
    </script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; color: #fff; text-align: center; padding: 1rem; }
    </style>
</head>
<body>
    <p>One moment, opening LooksLab in the App Store…</p>
    <noscript>
        <p>JavaScript is disabled. <a href="https://apps.apple.com/app/apple-store/id6760189133?pt=128604503&mt=8" style="color:#fff;">Open the App Store</a></p>
    </noscript>
</body>
</html>
